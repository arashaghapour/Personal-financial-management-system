openapi: 3.0.3

info:
  title: Personal Finance Management API
  description: |
    REST API for a personal finance management system.
    All protected resources are scoped to the authenticated user.
    The user ID is obtained from the authenticated JWT and must not be
    provided by the client.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Auth
    description: Authentication and user identity
  - name: Accounts
    description: Financial account management
  - name: Categories
    description: Transaction category management
  - name: Transactions
    description: Income and expense management
  - name: Budgets
    description: Budget management
  - name: Dashboard
    description: Financial dashboard
  - name: Reports
    description: Financial reports

paths:

  # ============================================================
  # AUTH
  # ============================================================

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access and refresh tokens
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Successfully logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'


  # ============================================================
  # ACCOUNTS
  # ============================================================

  /accounts:
    get:
      tags: [Accounts]
      summary: Get all accounts
      operationId: getAccounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user's accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Accounts]
      summary: Create an account
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get an account
      operationId: getAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Account retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Accounts]
      summary: Update an account
      operationId: updateAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Accounts]
      summary: Delete an account
      operationId: deleteAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Account deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'


  # ============================================================
  # CATEGORIES
  # ============================================================

  /categories:
    get:
      tags: [Categories]
      summary: Get categories
      operationId: getCategories
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          description: Filter categories by type
          schema:
            $ref: '#/components/schemas/CategoryType'
      responses:
        '200':
          description: List of authenticated user's categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Categories]
      summary: Create a category
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/CategoryAlreadyExists'

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get a category
      operationId: getCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Categories]
      summary: Update a category
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CategoryAlreadyExists'

    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'


  # ============================================================
  # TRANSACTIONS
  # ============================================================

  /transactions:
    get:
      tags: [Transactions]
      summary: Get transactions
      operationId: getTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionType'

        - name: accountId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1

        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid

        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: minAmount
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: 0

        - name: maxAmount
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: 0

        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/TransactionSort'

      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Transactions]
      summary: Create a transaction
      operationId: createTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /transactions/{id}:
    get:
      tags: [Transactions]
      summary: Get a transaction
      operationId: getTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Transactions]
      summary: Update a transaction
      operationId: updateTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Transactions]
      summary: Delete a transaction
      operationId: deleteTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '204':
          description: Transaction deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'


  # ============================================================
  # BUDGETS
  # ============================================================

  /budgets:
    get:
      tags: [Budgets]
      summary: Get budgets
      operationId: getBudgets
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: false
          description: Filter budgets by year
          schema:
            type: integer
            minimum: 1

        - name: month
          in: query
          required: false
          description: Filter budgets by month
          schema:
            type: integer
            minimum: 1
            maximum: 12

        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: List of authenticated user's budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Budgets]
      summary: Create a budget
      operationId: createBudget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
      responses:
        '201':
          description: Budget created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Budget already exists for this category and month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /budgets/{id}:
    get:
      tags: [Budgets]
      summary: Get a budget
      operationId: getBudget
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Budget retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Budgets]
      summary: Update a budget
      operationId: updateBudget
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetRequest'
      responses:
        '200':
          description: Budget updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Budgets]
      summary: Delete a budget
      operationId: deleteBudget
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '204':
          description: Budget deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /budgets/{id}/progress:
    get:
      tags: [Budgets]
      summary: Get budget spending progress
      operationId: getBudgetProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Budget spending progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetProgress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'


  # ============================================================
  # DASHBOARD
  # ============================================================

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get financial dashboard
      operationId: getDashboard
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: Include transactions on or after this date
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-10-01'

        - name: endDate
          in: query
          required: false
          description: Include transactions on or before this date
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-10-31'

      responses:
        '200':
          description: Dashboard data for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'


  # ============================================================
  # REPORTS
  # ============================================================

  /reports/summary:
    get:
      tags: [Reports]
      summary: Get financial summary report
      operationId: getSummaryReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/expenses:
    get:
      tags: [Reports]
      summary: Get expense report
      operationId: getExpenseReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expense report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/cash-flow:
    get:
      tags: [Reports]
      summary: Get cash flow report
      operationId: getCashFlowReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Cash flow report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowReport'
        '401':
          $ref: '#/components/responses/Unauthorized'


# ==============================================================
# COMPONENTS
# ==============================================================

components:

  # ------------------------------------------------------------
  # SECURITY
  # ------------------------------------------------------------

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ------------------------------------------------------------
  # PARAMETERS
  # ------------------------------------------------------------

  parameters:

    Id:
      name: id
      in: path
      required: true
      description: Numeric resource ID
      schema:
        type: integer
        minimum: 1

    CategoryId:
      name: id
      in: path
      required: true
      description: Category UUID
      schema:
        type: string
        format: uuid

    BudgetId:
      name: id
      in: path
      required: true
      description: Budget UUID
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        example: date:desc

    TransactionId:
      name: id
      in: path
      required: true
      description: Transaction UUID
      schema:
        type: string
        format: uuid

    TransactionSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - date:asc
          - date:desc
          - amount:asc
          - amount:desc
        default: date:desc

    StartDate:
      name: startDate
      in: query
      required: true
      schema:
        type: string
        format: date

    EndDate:
      name: endDate
      in: query
      required: true
      schema:
        type: string
        format: date


  # ------------------------------------------------------------
  # SCHEMAS
  # ------------------------------------------------------------

  schemas:

    # =========================
    # USER / AUTH
    # =========================

    User:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - createdAt
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1

    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds

    AuthResponse:
      type: object
      required:
        - user
        - accessToken
        - refreshToken
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer


    # =========================
    # ACCOUNT
    # =========================

    AccountType:
      type: string
      enum:
        - CASH
        - BANK
        - CREDIT_CARD
        - INVESTMENT
        - OTHER

    Account:
      type: object
      required:
        - id
        - userId
        - name
        - type
        - balance
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer

        userId:
          type: integer
          description: ID of the authenticated user who owns the account

        name:
          type: string
          minLength: 1
          maxLength: 100

        type:
          $ref: '#/components/schemas/AccountType'

        balance:
          type: number
          format: double

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/AccountType'
        initialBalance:
          type: number
          format: double
          minimum: 0
          default: 0

    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/AccountType'


    # =========================
    # CATEGORY
    # =========================

    CategoryType:
      type: string
      enum:
        - INCOME
        - EXPENSE

    Category:
      type: object
      required:
        - id
        - userId
        - name
        - normalizedName
        - type
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid

        userId:
          type: integer
          description: ID of the authenticated user who owns the category
          readOnly: true

        name:
          type: string
          minLength: 1
          maxLength: 100

        normalizedName:
          type: string
          description: Normalized category name used for uniqueness
          readOnly: true

        type:
          $ref: '#/components/schemas/CategoryType'

        createdAt:
          type: string
          format: date-time
          readOnly: true

        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CategoryType'
      description: |
        The authenticated user's ID is obtained from the JWT.
        userId must not be provided by the client.

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CategoryType'


    # =========================
    # TRANSACTION
    # =========================

    TransactionType:
      type: string
      enum:
        - INCOME
        - EXPENSE

    Transaction:
      type: object
      required:
        - id
        - userId
        - type
        - amount
        - date
        - accountId
        - categoryId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid

        userId:
          type: integer
          description: ID of the authenticated user who owns the transaction
          readOnly: true

        type:
          $ref: '#/components/schemas/TransactionType'

        amount:
          type: string
          description: Transaction amount serialized from Prisma Decimal
          pattern: '^\d+(\.\d+)?$'

        description:
          type: string
          maxLength: 500
          nullable: true

        date:
          type: string
          format: date

        accountId:
          type: integer
          minimum: 1

        categoryId:
          type: string
          format: uuid

        createdAt:
          type: string
          format: date-time
          readOnly: true

        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateTransactionRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateIncomeRequest'
        - $ref: '#/components/schemas/CreateExpenseRequest'
      discriminator:
        propertyName: type

    CreateIncomeRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - accountId
        - categoryId
        - amount
        - date
      properties:
        type:
          type: string
          enum: [INCOME]

        accountId:
          type: integer
          minimum: 1

        categoryId:
          type: string
          format: uuid

        amount:
          type: number
          format: double
          exclusiveMinimum: 0

        description:
          type: string
          maxLength: 500

        date:
          type: string
          format: date

    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - accountId
        - categoryId
        - amount
        - date
      properties:
        type:
          type: string
          enum: [EXPENSE]

        accountId:
          type: integer
          minimum: 1

        categoryId:
          type: string
          format: uuid

        amount:
          type: number
          format: double
          exclusiveMinimum: 0

        description:
          type: string
          maxLength: 500

        date:
          type: string
          format: date

    UpdateTransactionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: 0

        description:
          type: string
          maxLength: 500

        date:
          type: string
          format: date

        accountId:
          type: integer
          minimum: 1

        categoryId:
          type: string
          format: uuid

      description: |
        Transaction type cannot be changed.
        The authenticated user's ID is obtained from the JWT
        and cannot be provided by the client.


    # =========================
    # BUDGET
    # =========================

    BudgetStatus:
      type: string
      enum:
        - UNDER_BUDGET
        - NEAR_LIMIT
        - OVER_BUDGET

    Budget:
      type: object
      required:
        - id
        - userId
        - categoryId
        - amount
        - year
        - month
        - startDate
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true

        userId:
          type: integer
          description: ID of the authenticated user who owns the budget
          readOnly: true

        categoryId:
          type: string
          format: uuid
          description: Expense category associated with the budget

        amount:
          type: string
          description: Budget amount serialized from Prisma Decimal
          pattern: '^\d+(\.\d+)?$'

        year:
          type: integer
          minimum: 1

        month:
          type: integer
          minimum: 1
          maximum: 12

        startDate:
          type: string
          format: date-time
          readOnly: true

        createdAt:
          type: string
          format: date-time
          readOnly: true

        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateBudgetRequest:
      type: object
      additionalProperties: false
      required:
        - categoryId
        - amount
        - year
        - month
      properties:
        categoryId:
          type: string
          format: uuid

        amount:
          type: number
          format: double
          exclusiveMinimum: 0

        year:
          type: integer
          minimum: 1

        month:
          type: integer
          minimum: 1
          maximum: 12

      description: |
        Creates a budget for an expense category owned by the authenticated user.
        The user ID is obtained from the JWT and must not be provided by the client.

    UpdateBudgetRequest:
      type: object
      additionalProperties: false
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: 0

      description: |
        Updates the budget amount.
        The category, year, month, and user cannot be changed.

    BudgetProgress:
      type: object
      required:
        - budgetId
        - budgetAmount
        - spentAmount
        - remainingAmount
        - percentageUsed
        - status
      properties:
        budgetId:
          type: string
          format: uuid
          description: ID of the budget

        budgetAmount:
          type: number
          format: double
          description: Original budget amount

        spentAmount:
          type: number
          format: double
          description: Total expense amount spent for the budget category during the budget period

        remainingAmount:
          type: number
          format: double
          description: Budget amount minus spent amount

        percentageUsed:
          type: number
          format: double
          description: Percentage of the budget that has been spent

        status:
          $ref: '#/components/schemas/BudgetStatus'


    # =========================
    # DASHBOARD
    # =========================

    Dashboard:
      type: object
      required:
        - totalBalance
        - totalIncome
        - totalExpenses
        - netCashFlow
        - expenseByCategory
        - incomeByCategory
        - recentTransactions
      properties:
        totalBalance:
          type: number
          format: double
          description: Current total balance across all accounts owned by the authenticated user

        totalIncome:
          type: number
          format: double
          description: Total income transactions matching the requested date filters

        totalExpenses:
          type: number
          format: double
          description: Total expense transactions matching the requested date filters

        netCashFlow:
          type: number
          format: double
          description: Total income minus total expenses for the requested date range

        expenseByCategory:
          type: array
          description: Expense totals grouped by category
          items:
            $ref: '#/components/schemas/DashboardCategorySummary'

        incomeByCategory:
          type: array
          description: Income totals grouped by category
          items:
            $ref: '#/components/schemas/DashboardCategorySummary'

        recentTransactions:
          type: array
          description: Up to 5 most recent transactions matching the requested date filters
          items:
            $ref: '#/components/schemas/Transaction'

    DashboardCategorySummary:
      type: object
      required:
        - categoryId
        - categoryName
        - total
      properties:
        categoryId:
          type: string
          format: uuid

        categoryName:
          type: string

        total:
          type: string
          description: Category total serialized from Prisma Decimal
          pattern: '^\d+(\.\d+)?'


    # =========================
    # REPORTS
    # =========================

    SummaryReport:
      type: object
      properties:
        totalIncome:
          type: number
        totalExpenses:
          type: number
        netCashFlow:
          type: number
        transactionCount:
          type: integer

    ExpenseReport:
      type: object
      properties:
        totalExpenses:
          type: number
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAmount'

    CashFlowReport:
      type: object
      properties:
        totalIncome:
          type: number
        totalExpenses:
          type: number
        netCashFlow:
          type: number
        data:
          type: array
          items:
            $ref: '#/components/schemas/CashFlowEntry'

    CashFlowEntry:
      type: object
      required:
        - date
        - income
        - expenses
        - net
      properties:
        date:
          type: string
          format: date
        income:
          type: number
        expenses:
          type: number
        net:
          type: number

    CategoryAmount:
      type: object
      required:
        - categoryId
        - categoryName
        - amount
      properties:
        categoryId:
          type: string
          format: uuid

        categoryName:
          type: string

        amount:
          type: number


    # =========================
    # PAGINATION
    # =========================

    PaginatedTransactions:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer


    # =========================
    # ERROR
    # =========================

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - NOT_FOUND
                - INTERNAL_SERVER_ERROR
                - ACCOUNT_NOT_FOUND
                - CATEGORY_ALREADY_EXISTS
                - CATEGORY_NOT_FOUND
                - TRANSACTION_NOT_FOUND
                - INSUFFICIENT_BALANCE
                - CATEGORY_TYPE_MISMATCH
                - INVALID_BUDGET_CATEGORY
                - DUPLICATE_BUDGET

            message:
              type: string

            details:
              type: array
              items:
                type: object
                additionalProperties: true


  # ------------------------------------------------------------
  # RESPONSES
  # ------------------------------------------------------------

  responses:

    BadRequest:
      description: Invalid request or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required or token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found or does not belong to the authenticated user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    CategoryAlreadyExists:
      description: A category with the same normalized name and type already exists for the authenticated user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'